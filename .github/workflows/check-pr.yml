name: Check PR

on: pull_request
permissions: {}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    concurrency:
      group: pre-commit-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache-dependency-path: core/publish-key/package-lock.json
          node-version-file: core/publish-key/.nvmrc
          cache: npm

      - name: Install npm dependencies
        working-directory: core/publish-key
        run: npm ci

      - name: Run pre-commit
        uses: govuk-one-login/github-actions/code-quality/run-pre-commit@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          pull-repository: false
          all-files: true

  run-unit-tests-publish-key-fn:
    name: Run unit tests (publish key function)
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        uses: govuk-one-login/github-actions/node/run-script@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          working-directory: core/publish-key
          node-version-file: core/publish-key/.nvmrc
          script: npm run test:coverage
